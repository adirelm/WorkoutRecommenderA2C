[project]
name = "workoutrl"
version = "1.0.0"
description = "Bar-Ilan Vibe-Coding Workshop Assignment 3 — LSTM transition model + REINFORCE + A2C on a synthetic workout trainee"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Solo developer (architect role per CLAUDE.md §1.4)"}]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",          # parquet
    "matplotlib>=3.8",
    "scipy>=1.13",            # for JS-divergence helpers
    "pyyaml>=6.0",            # config loader
    "kaggle>=1.6",            # dataset download
    "streamlit>=1.40",        # GUI framework (Phase 9)
    "plotly>=5.20",           # interactive charts in GUI
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "ipykernel>=6.29",         # for the analysis notebook
    "nbclient>=0.10",          # for CI-side notebook execution
    "streamlit-extras>=0.4",   # optional polish utilities for the GUI
    "playwright>=1.40",        # for scripts/capture_gui_screenshots.py
    "nbconvert>=7.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["E501"]    # line-length is handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "RUF002"]   # magic numbers + unicode in test docstrings are fine
# program_filter accepts many domain-driven config knobs (primary, fallbacks, min_weeks,
# equipment, min_minutes, max_minutes) — refactoring into a dataclass deferred to keep
# the public API straightforward for the SDK layer.
"src/data/program_filter.py" = ["PLR0913"]
# torch.nn.functional as F is the universal PyTorch convention.
"src/model/policy_net.py" = ["N812"]
"src/model/actor_critic.py" = ["N812"]
# Streamlit page filenames must start with a digit (NN_name.py) for sidebar ordering —
# N999 (invalid module name) is by design here. Hebrew / Unicode math glyphs in
# user-facing strings are intentional (bilingual UX).
"src/gui/pages/*" = ["N999", "RUF001", "RUF002", "PLC0415", "B905"]
# Screenshot helper does Playwright import lazily so the script remains importable
# in environments without Playwright. Unicode × in the docstring is intentional.
"scripts/capture_gui_screenshots.py" = ["PLC0415", "PLR2004", "RUF002"]
# Streamlit GUI helpers: zip(strict=) noise on st.columns iteration is not worth the churn.
"src/gui/components.py" = ["B905"]
"src/gui/state.py" = ["SIM118"]  # st.session_state.keys() is the documented Streamlit API

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/test_*", "src/__init__.py", "*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__.:"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
